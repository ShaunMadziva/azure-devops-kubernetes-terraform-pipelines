trigger:
- main

pool:
  vmImage: ubuntu-latest


stages:
  - stage: Build
    jobs:
      - job: FirstJob
        steps:
          - bash: echo Build / FirstJob

      - job: SecondJob
        steps:
          - bash: echo Build / SecondJob
          - bash: echo $(PipelineLevelVariable)



  - stage: DevDeploy
    dependsOn: Build
    variables:
      environment: DevDeploy
    jobs:
      - job: FirstJob
        steps:
          - bash: echo $(environment) / FirstJob

  - stage: QADeploy
    dependsOn: Build
    variables:
      environment: QADeploy
    jobs:
      - job: FirstJob
        steps:
          - bash: echo $(environment) / FirstJob

  - stage: ProdDeploy
    dependsOn: 
    - DevDeploy
    - QADeploy
    variables:
      environment: QADeploy
    jobs:
      - job: FirstJob
        steps:
          - bash: echo $(environment) / FirstJob
